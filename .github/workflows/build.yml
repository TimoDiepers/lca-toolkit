name: Build installers

on:
  workflow_dispatch:
    inputs:
      update-ab:
        description: Re-lock to the newest Activity Browser beta before building
        type: boolean
        default: true
  push:
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: osx-arm64 }
          - { os: windows-latest, platform: win-64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.51.0
          run-install: false

      - name: Check tag matches pixi.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pixi.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pixi.toml version $version (expected v$version)"
            exit 1
          fi

      - name: Update Activity Browser to newest beta
        if: inputs.update-ab
        run: pixi update activity-browser

      - name: Build installer
        run: pixi run -e build installer
        env:
          # Optional: git URL of teaching material to offer during installation (see README).
          MATERIAL_GIT_URL: ${{ secrets.MATERIAL_GIT_URL }}
          MATERIAL_NAME: ${{ vars.MATERIAL_NAME }}
          MATERIAL_BRANCH: ${{ vars.MATERIAL_BRANCH }}

      - name: Install and smoke-test (macOS)
        if: runner.os == 'macOS'
        run: |
          installer -pkg build/osx-arm64/installer/*.pkg -target CurrentUserHomeDirectory
          ~/Library/lca-toolkit/bin/python tests/smoke.py --launch
          ~/Library/lca-toolkit/bin/python tests/test_launcher.py
          ls ~/Applications/"Activity Browser (LCA Toolkit).app" ~/Applications/"JupyterLab (LCA Toolkit).app"

      - name: Install for all users and smoke-test (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg build/osx-arm64/installer/*.pkg -target /
          /Library/lca-toolkit/bin/python tests/smoke.py
          ls /Applications/"Activity Browser (LCA Toolkit).app" /Applications/"JupyterLab (LCA Toolkit).app"
          grep -o "'/Library/lca-toolkit/_conda'" /Applications/"Activity Browser (LCA Toolkit).app"/Contents/MacOS/*-script

      - name: Install and smoke-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/win-64/installer/*.exe).FullName
          Start-Process $exe -Wait -ArgumentList '/S', '/InstallationType=JustMe', '/RegisterPython=0', '/AddToPath=0', "/D=$env:USERPROFILE\lca-toolkit"
          & "$env:USERPROFILE\lca-toolkit\python.exe" tests/smoke.py --launch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:USERPROFILE\lca-toolkit\python.exe" tests/test_launcher.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "*LCA Toolkit*.lnk" | Tee-Object -Variable lnks
          if (-not $lnks) { throw "Start Menu shortcuts missing" }

      - name: Install for all users and smoke-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/win-64/installer/*.exe).FullName
          Start-Process $exe -Wait -ArgumentList '/S', '/InstallationType=AllUsers', '/RegisterPython=0', '/AddToPath=0', "/D=$env:ProgramData\lca-toolkit"
          & "$env:ProgramData\lca-toolkit\python.exe" tests/smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Filter "*LCA Toolkit*.lnk" | Tee-Object -Variable lnks
          if (-not $lnks) { throw "All-users Start Menu shortcuts missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            build/${{ matrix.platform }}/installer/*
            pixi.lock

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*/installer/*
