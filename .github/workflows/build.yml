name: Build installers

on:
  workflow_dispatch:
    inputs:
      update-ab:
        description: Re-lock to the newest Activity Browser beta before building
        type: boolean
        default: true
  push:
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: osx-arm64 }
          - { os: windows-latest, platform: win-64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.51.0
          run-install: false

      - name: Update Activity Browser to newest beta
        if: inputs.update-ab
        run: pixi update activity-browser

      - name: Build installer
        run: pixi run -e build installer

      - name: Install and smoke-test (macOS)
        if: runner.os == 'macOS'
        run: |
          installer -pkg build/osx-arm64/installer/*.pkg -target CurrentUserHomeDirectory
          ~/lca-toolkit/bin/python tests/smoke.py --launch
          ls ~/Applications/"Activity Browser (LCA Toolkit).app" ~/Applications/"JupyterLab (LCA Toolkit).app"

      - name: Install and smoke-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/win-64/installer/*.exe).FullName
          Start-Process $exe -Wait -ArgumentList '/S', '/InstallationType=JustMe', '/RegisterPython=0', '/AddToPath=0', "/D=$env:USERPROFILE\lca-toolkit"
          & "$env:USERPROFILE\lca-toolkit\python.exe" tests/smoke.py --launch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "*LCA Toolkit*.lnk" | Tee-Object -Variable lnks
          if (-not $lnks) { throw "Start Menu shortcuts missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            build/${{ matrix.platform }}/installer/*
            pixi.lock

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*/installer/*
