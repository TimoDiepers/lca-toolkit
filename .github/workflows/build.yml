name: Build installers

on:
  workflow_dispatch:
    inputs:
      update-ab:
        description: Re-lock to the newest Activity Browser beta before building
        type: boolean
        default: true
  push:
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: osx-arm64 }
          - { os: macos-15-intel, platform: osx-64 }
          - { os: windows-latest, platform: win-64 }
          - { os: ubuntu-latest, platform: linux-64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.51.0
          run-install: false

      - name: Check tag matches pixi.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pixi.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pixi.toml version $version (expected v$version)"
            exit 1
          fi

      - name: Update Activity Browser to newest beta
        if: inputs.update-ab
        run: pixi update activity-browser

      # Downloads only depend on the lock: conda packages (constructor's cache), the PyPI
      # wheels and the build tooling environment.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.conda/constructor
            build/${{ matrix.platform }}/wheels
            .pixi/envs/build
          key: build-${{ matrix.platform }}-${{ hashFiles('pixi.lock') }}
          restore-keys: build-${{ matrix.platform }}-

      - name: Build installer
        run: pixi run -e build installer

      - name: Install and smoke-test (macOS)
        if: runner.os == 'macOS'
        run: |
          installer -pkg build/${{ matrix.platform }}/installer/*.pkg -target CurrentUserHomeDirectory
          ~/Library/lca-toolkit/bin/python tests/smoke.py --launch
          ~/Library/lca-toolkit/bin/python tests/test_launcher.py
          ls ~/Applications/"LCA Browser.app" ~/Applications/"LCA Notebooks.app"
          ls ~/Applications/"LCA Browser.app"/Contents/Resources/*.icns

      - name: Reinstall over the existing installation (macOS)
        if: runner.os == 'macOS'
        run: |
          touch ~/Library/lca-toolkit/old-install-marker
          installer -pkg build/${{ matrix.platform }}/installer/*.pkg -target CurrentUserHomeDirectory
          test ! -e ~/Library/lca-toolkit/old-install-marker  # old folder was replaced
          ~/Library/lca-toolkit/bin/python tests/smoke.py
          ls ~/Applications/"LCA Browser.app" ~/Applications/"LCA Notebooks.app"

      - name: Install for all users and smoke-test (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg build/${{ matrix.platform }}/installer/*.pkg -target /
          /Library/lca-toolkit/bin/python tests/smoke.py
          ls /Applications/"LCA Browser.app" /Applications/"LCA Notebooks.app"
          grep -o "'/Library/lca-toolkit/_conda'" /Applications/"LCA Browser.app"/Contents/MacOS/*-script

      - name: Install and smoke-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/win-64/installer/*.exe).FullName
          Start-Process $exe -Wait -ArgumentList '/S', '/InstallationType=JustMe', '/RegisterPython=0', '/AddToPath=0', "/D=$env:USERPROFILE\lca-toolkit"
          & "$env:USERPROFILE\lca-toolkit\python.exe" tests/smoke.py --launch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:USERPROFILE\lca-toolkit\python.exe" tests/test_launcher.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "LCA *.lnk" | Tee-Object -Variable lnks
          if (-not $lnks) { throw "Start Menu shortcuts missing" }

      - name: Reinstall over the existing installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/win-64/installer/*.exe).FullName
          New-Item "$env:USERPROFILE\lca-toolkit\old-install-marker" -ItemType File | Out-Null
          $p = Start-Process $exe -Wait -PassThru -ArgumentList '/S', '/InstallationType=JustMe', '/RegisterPython=0', '/AddToPath=0', "/D=$env:USERPROFILE\lca-toolkit"
          if ($p.ExitCode) { throw "reinstall failed with exit code $($p.ExitCode)" }
          if (Test-Path "$env:USERPROFILE\lca-toolkit\old-install-marker") { throw "old installation was not replaced" }
          & "$env:USERPROFILE\lca-toolkit\python.exe" tests/smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "LCA *.lnk" | Tee-Object -Variable lnks
          if (-not $lnks) { throw "Start Menu shortcuts missing after reinstall" }

      - name: Install for all users and smoke-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/win-64/installer/*.exe).FullName
          Start-Process $exe -Wait -ArgumentList '/S', '/InstallationType=AllUsers', '/RegisterPython=0', '/AddToPath=0', "/D=$env:ProgramData\lca-toolkit"
          & "$env:ProgramData\lca-toolkit\python.exe" tests/smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Filter "LCA *.lnk" | Tee-Object -Variable lnks
          if (-not $lnks) { throw "All-users Start Menu shortcuts missing" }

      - name: Install and smoke-test (Linux)
        if: runner.os == 'Linux'
        run: |
          bash build/linux-64/installer/*.sh -b -p ~/lca-toolkit
          ~/lca-toolkit/bin/python tests/smoke.py --launch
          ~/lca-toolkit/bin/python tests/test_launcher.py
          ls ~/.local/share/applications/ | grep -i "lca"

      - name: Reinstall over the existing installation (Linux)
        if: runner.os == 'Linux'
        run: |
          touch ~/lca-toolkit/old-install-marker
          bash build/linux-64/installer/*.sh -b -p ~/lca-toolkit
          test ! -e ~/lca-toolkit/old-install-marker  # old folder was replaced
          ~/lca-toolkit/bin/python tests/smoke.py

      - name: Install for all users and smoke-test (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -rf ~/lca-toolkit  # the runner's disk is too small for two installations
          sudo bash build/linux-64/installer/*.sh -b -p /opt/lca-toolkit
          /opt/lca-toolkit/bin/python tests/smoke.py
          ls /usr/share/applications/ | grep -i "lca"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            build/${{ matrix.platform }}/installer/*
            pixi.lock

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Copies without the version in the name, so the README's
      # releases/latest/download/<name> links always point to the newest release.
      - name: Add copies with stable file names
        run: |
          cp build/win-64/installer/*.exe LCA-Toolkit-Windows-x86_64.exe
          cp build/osx-arm64/installer/*.pkg LCA-Toolkit-macOS-arm64.pkg
          cp build/osx-64/installer/*.pkg LCA-Toolkit-macOS-x86_64.pkg
          cp build/linux-64/installer/*.sh LCA-Toolkit-Linux-x86_64.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*/installer/*
            LCA-Toolkit-Windows-x86_64.exe
            LCA-Toolkit-macOS-arm64.pkg
            LCA-Toolkit-macOS-x86_64.pkg
            LCA-Toolkit-Linux-x86_64.sh
